# install       pip3 install prek
# run           prek run -a  # or --all-files
# update deps   prek autoupdate

repos:

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-builtin-literals
      - id: check-docstring-first
      - id: debug-statements
      - id: forbid-new-submodules
      - id: name-tests-test
        args: ["--pytest-test-first"]
      - id: requirements-txt-fixer

  - repo: builtin # preks faster versions
    hooks:
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: check-json
      - id: check-json5
      - id: pretty-format-json
        args: ["--autofix"]
      - id: check-toml
      - id: check-yaml
      - id: check-xml
      - id: mixed-line-ending
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-merge-conflict
      - id: detect-private-key
      # - id: no-commit-to-branch
      - id: check-executables-have-shebangs

  - repo: https://github.com/codespell-project/codespell
    rev: "v2.4.3"
    hooks:
      - id: codespell

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.67
    hooks:
      - id: rumdl
        args: [--fix]
      - id: rumdl-fmt  # Pure format, always exits 0

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.0
    hooks:
      - id: zizmor
        args: ["--min-severity", "high", "--no-progress", "--fix", "."]

#  - repo: https://github.com/pre-commit/mirrors-clang-format
#    rev: 'v14.0.6'
#    hooks:
#      - id: clang-format
#        types_or: [c++, c]
# TODO: activate later

  # cpp-check comes last! fails if uninstalled
  - repo: https://github.com/pocc/pre-commit-hooks
    rev: "v1.4.0"
    hooks:
      - id: cppcheck
        args:
          - "--enable=all"
          - "--std=c++11"
          - "--language=c++"
          - "--platform=unix32"
          - "--verbose"
          - "-q"
          - "--max-ctu-depth=10"
          - "--suppress=unusedFunction"
          - "--force"
          - "-I./src"
          - "--check-config"
